<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ResumeBot - AI Resume Builder</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <nav>
        <div class="logo">ResumeBot</div>
        <ul>
            <li><a href="#builder">Build Resume</a></li>
        </ul>
    </nav>

    <section class="builder" id="builder">
        <h2>AI Resume Builder</h2>
        <textarea id="userInput" placeholder="Enter skills, experience, education..."></textarea>
        <input id="jobTitle" type="text" placeholder="Job Title (e.g., Web Developer)">
        <button id="generateBtn">Generate Resume</button>

        <h3>Your Resume:</h3>
        <pre id="output"></pre>

        <button id="downloadPdf">Download PDF</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
